plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fundmessenger'
version = '0.0.1-SNAPSHOT'
description = '펀드메신저 v2 백엔드'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// OAuth2 (manual REST calls, not Spring OAuth2 login)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// PostgreSQL
	runtimeOnly 'org.postgresql:postgresql'

	// PDF Processing
	implementation 'org.apache.pdfbox:pdfbox:3.0.4'

	// HTML Sanitization
	implementation 'org.jsoup:jsoup:1.18.1'

	// Rate Limiting
	implementation 'com.bucket4j:bucket4j-core:8.10.1'

	// Web Push (VAPID)
	implementation 'nl.martijndwars:web-push:5.1.1'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

	// Google Cloud Storage (파일 업로드)
	implementation platform('com.google.cloud:libraries-bom:26.43.0')
	implementation 'com.google.cloud:google-cloud-storage'

	// Cloud SQL Socket Factory (Cloud Run → Cloud SQL 연결)
	runtimeOnly 'com.google.cloud.sql:postgres-socket-factory:1.21.0'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 루트 .env 파일에서 환경변수 로드 (bootRun 시)
bootRun {
	def envFile = file('../.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def trimmed = line.trim()
			if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
				def idx = trimmed.indexOf('=')
				def key = trimmed.substring(0, idx).trim()
				def value = trimmed.substring(idx + 1).trim()
				environment key, value
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 테스트에서도 .env 로드
	def envFile = file('../.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def trimmed = line.trim()
			if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
				def idx = trimmed.indexOf('=')
				def key = trimmed.substring(0, idx).trim()
				def value = trimmed.substring(idx + 1).trim()
				environment key, value
			}
		}
	}
}

// Cerebras 스트레스 테스트 (서버 독립 실행)
tasks.register('cerebrasStress', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.fundmessenger.CerebrasStressTest'
	def envFile = file('../.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def trimmed = line.trim()
			if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
				def idx = trimmed.indexOf('=')
				def key = trimmed.substring(0, idx).trim()
				def value = trimmed.substring(idx + 1).trim()
				environment key, value
			}
		}
	}
}
