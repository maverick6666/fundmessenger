services:
  db:
    image: postgres:16-alpine
    container_name: fundmessenger-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: fundmessenger
      POSTGRES_USER: funduser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev-only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
